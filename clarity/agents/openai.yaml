interface:
  display_name: "面向读者的清晰写作"
  short_description: "文稿、软件文档与指令（含 skill）的写作审查、代码可理解性改进；排除纯格式或无阅读问题的代码实现"
  default_prompt: "使用 $clarity，根据目标读者、阅读任务和交付语言完成文稿、软件文档或指令的起草、改写或审查，或改善代码的可理解性。软件文档包括 README、需求、spec、API 参考、C4 架构与开发计划；降低不必要的理解成本，保留事实与声音。代码表达遵循本次允许的变更范围：保行为改写保持约定行为，新写或获准的行为变更遵循目标需求与仍有效的契约，不另定开发顺序或测试策略。若任务仅为纯格式修正或无阅读问题的代码实现，直接按任务处理，不启动本技能流程。"
